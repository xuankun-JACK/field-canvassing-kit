<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#EDEAE3;font-family:"PingFang SC","Helvetica Neue",sans-serif;}
.phone{width:900px;height:1400px;margin:0 auto;background:#F2F1EE;position:relative;overflow:hidden;}
.top{height:120px;background:#2E6BE6;color:#fff;display:flex;align-items:flex-end;padding:0 34px 22px;box-sizing:border-box;}
.top .name{font-size:34px;font-weight:600;}
</style></head><body>
<div class="phone">
  <div class="top"><div class="name">小鲲 · 地推记录</div></div>
  <svg width="900" height="1280" viewBox="0 0 900 1280">
    <!-- 时间 -->
    <text x="450" y="86" font-size="24" fill="#9A948A" text-anchor="middle">6 月 12 日 17:42</text>

    <!-- 机器人消息 1 -->
    <circle cx="76" cy="176" r="34" fill="#2E6BE6"/>
    <text x="76" y="188" font-size="28" fill="#fff" text-anchor="middle">鲲</text>
    <rect x="132" y="142" width="560" height="112" rx="20" fill="#fff"/>
    <text x="160" y="188" font-size="26" fill="#3D434B">回来了就说一句「获客」，</text>
    <text x="160" y="226" font-size="26" fill="#3D434B">分几段说也行，我来拼。</text>

    <!-- 用户语音 -->
    <rect x="486" y="292" width="300" height="86" rx="20" fill="#95C6A0"/>
    <g stroke="#2F5C3B" stroke-width="5" stroke-linecap="round">
      <line x1="516" y1="322" x2="516" y2="348"/><line x1="532" y1="314" x2="532" y2="356"/>
      <line x1="548" y1="322" x2="548" y2="348"/><line x1="564" y1="318" x2="564" y2="352"/>
      <line x1="580" y1="326" x2="580" y2="344"/></g>
    <text x="606" y="343" font-size="24" fill="#22452C">语音 8″</text>
    <circle cx="800" cy="336" r="34" fill="#C9C2B4"/>
    <text x="800" y="348" font-size="26" fill="#fff" text-anchor="middle">我</text>

    <!-- 机器人消息 2 -->
    <circle cx="76" cy="424" r="34" fill="#2E6BE6"/>
    <text x="76" y="436" font-size="28" fill="#fff" text-anchor="middle">鲲</text>
    <rect x="132" y="392" width="430" height="66" rx="20" fill="#fff"/>
    <text x="160" y="434" font-size="26" fill="#3D434B">已收到第 1 段，继续说。</text>

    <!-- 用户语音 2 -->
    <rect x="486" y="496" width="300" height="86" rx="20" fill="#95C6A0"/>
    <g stroke="#2F5C3B" stroke-width="5" stroke-linecap="round">
      <line x1="516" y1="528" x2="516" y2="550"/><line x1="532" y1="520" x2="532" y2="558"/>
      <line x1="548" y1="528" x2="548" y2="550"/><line x1="564" y1="524" x2="564" y2="554"/></g>
    <text x="606" y="547" font-size="24" fill="#22452C">语音 5″</text>

    <!-- 机器人：合并成卡 -->
    <circle cx="76" cy="668" r="34" fill="#2E6BE6"/>
    <text x="76" y="680" font-size="28" fill="#fff" text-anchor="middle">鲲</text>
    <rect x="132" y="620" width="620" height="272" rx="20" fill="#fff"/>
    <rect x="132" y="620" width="620" height="10" rx="5" fill="#2E6BE6" opacity=".8"/>
    <text x="160" y="676" font-size="24" fill="#8A8478">两段收到了，整理成这样，</text>
    <text x="160" y="712" font-size="24" fill="#8A8478">看一下，不对就改。</text>

    <g font-size="25" fill="#3D434B">
      <text x="160" y="764">日期　6 月 12 日</text>
      <text x="160" y="806">点位　示例点位（P-02）</text>
      <text x="160" y="848">触达　3 位客户</text>
    </g>
    <g font-size="22" fill="#9A948A"><text x="560" y="764">可改</text></g>

    <!-- 按钮 -->
    <rect x="160" y="912" width="180" height="68" rx="34" fill="#F0EEE8"/>
    <text x="250" y="956" font-size="25" fill="#5B6068" text-anchor="middle">改一下</text>
    <rect x="368" y="912" width="200" height="68" rx="34" fill="#2E6BE6"/>
    <text x="468" y="956" font-size="25" fill="#fff" text-anchor="middle">确认入库</text>

    <!-- 输入栏 -->
    <rect x="0" y="1140" width="900" height="140" fill="#EDEBE6"/>
    <rect x="40" y="1180" width="620" height="70" rx="35" fill="#fff"/>
    <text x="76" y="1226" font-size="24" fill="#B4AEA3">按住说话</text>
    <circle cx="740" cy="1215" r="46" fill="#2E6BE6"/>
    <g stroke="#fff" stroke-width="5" stroke-linecap="round">
      <line x1="728" y1="1200" x2="728" y2="1230"/><line x1="740" y1="1194" x2="740" y2="1236"/><line x1="752" y1="1200" x2="752" y2="1230"/></g>
    <text x="826" y="1226" font-size="24" fill="#8A8478">＋</text>
  </svg>
</div>
</body></html>
