<!doctype html>
<html><head><meta charset="utf-8">
<style>
  *{box-sizing:border-box}
  body{margin:0;width:1200px;height:1000px;position:relative;overflow:hidden;
       font-family:"PingFang SC","Helvetica Neue",sans-serif;color:#2A2F36;
       background:#E8E4DC;}
  .map{position:absolute;inset:0;filter:blur(3px);opacity:.85}
  .grid{position:absolute;inset:0;
    background-image:linear-gradient(#DCD7CE 2px,transparent 2px),linear-gradient(90deg,#DCD7CE 2px,transparent 2px);
    background-size:180px 180px}
  .blk{position:absolute;background:#D7D2C8;border-radius:6px}
  .pin{position:absolute;width:34px;height:34px;border-radius:6px;background:#2E6BE6}
  .pin.g{background:#9AA5B1}.pin.y{background:#E0A32E}.pin.r{background:#D9534F}
  .card{position:absolute;left:56px;top:150px;width:640px;background:#fff;border-radius:16px;
        box-shadow:0 12px 40px rgba(0,0,0,.14);padding:34px 38px}
  h2{margin:0 0 10px;font-size:38px;font-weight:600}
  .meta{font-size:19px;color:#8A857C;margin-bottom:28px}
  .row{display:flex;align-items:center;gap:18px;margin-bottom:18px;font-size:21px}
  .lb{width:96px;color:#6F6A61}
  .track{flex:1;height:16px;background:#EDE9E2;border-radius:8px;overflow:hidden}
  .fill{height:100%;border-radius:8px;background:#2E6BE6}
  .fill.mid{background:#5B8CEA}.fill.low{background:#9DBBF2}
  .val{width:132px;text-align:right;font-variant-numeric:tabular-nums}
  .val small{color:#9A958C;font-size:17px;margin-left:6px}
  .btns{display:flex;gap:16px;margin-top:30px}
  .btn{font-size:21px;padding:16px 32px;border-radius:10px;background:#2E6BE6;color:#fff}
  .btn.ghost{background:#fff;color:#2E6BE6;border:2px solid #2E6BE6}
</style></head><body>
<div class="map"><div class="grid"></div>
  <div class="blk" style="left:120px;top:120px;width:300px;height:220px"></div>
  <div class="blk" style="left:520px;top:90px;width:260px;height:260px"></div>
  <div class="blk" style="left:840px;top:180px;width:280px;height:200px"></div>
  <div class="blk" style="left:180px;top:640px;width:340px;height:210px"></div>
  <div class="blk" style="left:700px;top:700px;width:360px;height:160px"></div>
  <div class="pin" style="left:1080px;top:520px"></div>
  <div class="pin g" style="left:210px;top:470px"></div>
  <div class="pin y" style="left:900px;top:380px"></div>
  <div class="pin r" style="left:640px;top:560px"></div>
</div>
<div class="card">
  <h2>点位 P-03</h2>
  <div class="meta">状态：重点跟进 · 距当前位置 0.8 km · 负责：组员 A</div>
  <div class="row"><span class="lb">接触</span><div class="track"><div class="fill" style="width:96%"></div></div><span class="val">120</span></div>
  <div class="row"><span class="lb">留联系</span><div class="track"><div class="fill mid" style="width:58%"></div></div><span class="val">28<small>23%</small></span></div>
  <div class="row"><span class="lb">约下一步</span><div class="track"><div class="fill low" style="width:26%"></div></div><span class="val">8<small>7%</small></span></div>
  <div class="row"><span class="lb">成交</span><div class="track"><div class="fill low" style="width:12%"></div></div><span class="val">3<small>2.5%</small></span></div>
  <div class="btns"><div class="btn">录入一条记录</div><div class="btn ghost">看历史</div></div>
</div>
</body></html>
