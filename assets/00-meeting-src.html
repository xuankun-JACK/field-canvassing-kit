<!doctype html>
<html><head><meta charset="utf-8"><style>

.stage{width:1600px;height:900px;position:relative;overflow:hidden;background:#F4F1EC;}
.cap{position:absolute;left:64px;bottom:40px;font-size:26px;color:#4a4f57;}
.cap b{color:#1f2328;font-weight:600;}
</style></head><body>
<div class="stage">

  <rect x="0" y="0" width="1600" height="628" fill="#EFEBE3"/>

  <rect x="196" y="552" width="212" height="112" rx="4" fill="#C7C0B2"/>
  <rect x="186" y="540" width="232" height="16" rx="6" fill="#B9B2A4"/>

  <rect x="520" y="648" width="810" height="24" rx="12" fill="#C9C2B4"/>
  <rect x="560" y="672" width="16" height="120" fill="#BDB6A7"/>
  <rect x="1270" y="672" width="16" height="120" fill="#BDB6A7"/>

  <!-- seat A sleeping on table -->
  <g>
    <ellipse cx="628" cy="700" rx="62" ry="10" fill="#DCD6CA"/>
    <circle cx="612" cy="560" r="27" fill="#9AA5B1"/>
    <path d="M578 646 q34 -56 68 0 z" fill="#9AA5B1"/>

  <g>
    <ellipse cx="1168" cy="700" rx="54" ry="10" fill="#DCD6CA"/>
    <circle cx="1160" cy="556" r="27" fill="#9AA5B1"/>
    <path d="M1128 646 q32 -54 64 0 z" fill="#9AA5B1"/>

  <rect x="690" y="638" width="72" height="9" rx="3" fill="#FBFAF7" stroke="#DCD6CB"/>
  <rect x="1096" y="640" width="64" height="8" rx="3" fill="#FBFAF7" stroke="#DCD6CB"/>

  <rect x="1380" y="300" width="150" height="328" rx="5" fill="#E7E2D8" stroke="#D6D0C4" stroke-width="3"/>

  <ellipse cx="1390" cy="700" rx="72" ry="12" fill="#D9D3C7"/>

    <circle cx="1392" cy="424" r="32" fill="#2E6BE6"/>

<div class="cap"><b>第一次团队会</b>：讲的很多，听的很少。管理者站在门边，没说话。</div>
</div>
</body></html>
