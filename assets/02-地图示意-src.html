<!doctype html><html lang="zh"><head><meta charset="utf-8">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1600px;height:900px;background:#F4F1EC;color:#1C2026;overflow:hidden;
 font-family:"PingFang SC","Helvetica Neue",sans-serif}
.top{position:absolute;left:44px;top:34px;right:44px;display:flex;justify-content:space-between;align-items:baseline}
.brand{font-size:26px;font-weight:600;letter-spacing:.04em}
.brand span{color:#8A857C;font-weight:400;margin-left:12px;font-size:22px}
.note{font-size:20px;color:#A9A49B;letter-spacing:.06em}
.stage{position:absolute;left:44px;top:86px;width:960px;height:740px;background:#FBF9F5;
 border:1px solid #E4E0D8;border-radius:16px;overflow:hidden}
.grid{position:absolute;inset:0;
 background-image:linear-gradient(#ECE8E0 1px,transparent 1px),linear-gradient(90deg,#ECE8E0 1px,transparent 1px);
 background-size:60px 60px}
.road{position:absolute;background:#E8E3D9}
.r1{left:0;top:300px;width:100%;height:16px}
.r2{left:430px;top:0;width:16px;height:100%}
.r3{left:0;top:560px;width:100%;height:10px;background:#EFEBE3}
.r4{left:730px;top:0;width:10px;height:100%;background:#EFEBE3}
.ring{position:absolute;left:430px;top:300px;width:300px;height:262px;border:2px dashed #D9C9B4;border-radius:50%;opacity:.9}
.hub{position:absolute;left:484px;top:352px;width:24px;height:24px;border-radius:50%;
 background:#1C2026;box-shadow:0 0 0 8px rgba(28,32,38,.1)}
.hublabel{position:absolute;left:516px;top:348px;font-size:20px;color:#5B6068;font-weight:500}
.pt{position:absolute;width:26px;height:26px;border-radius:50%;border:3px solid #fff;
 box-shadow:0 1px 3px rgba(0,0,0,.18)}
.sq{border-radius:5px}
.tri{width:0;height:0;border:0;border-left:15px solid transparent;border-right:15px solid transparent;
 border-bottom:26px solid #000;border-radius:0;box-shadow:none}
.lb{position:absolute;font-size:17px;color:#5B6068;background:rgba(251,249,245,.86);padding:1px 5px;border-radius:4px}
.panel{position:absolute;right:44px;top:86px;width:496px}
.card{background:#fff;border:1px solid #E4E0D8;border-radius:16px;padding:22px 26px;margin-bottom:13px}
.ct{font-size:19px;color:#A9A49B;letter-spacing:.08em;margin-bottom:11px}
.pname{font-size:32px;font-weight:600;display:flex;align-items:center;gap:12px}
.dot{width:14px;height:14px;border-radius:50%;background:#2E6BE6;display:inline-block}
.rows{margin-top:13px;font-size:21px;line-height:1.92;color:#3D434B;display:flex;justify-content:space-between}
.rows b{font-weight:600;color:#1C2026}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px;font-size:20px;color:#3D434B}
.li{display:flex;align-items:center;gap:10px}
.sw{width:16px;height:16px;border-radius:50%}
.bar{height:12px;border-radius:6px;background:#EDE9E1;margin-top:14px;overflow:hidden}
.bar>i{display:block;height:100%;width:65%;background:#2E6BE6;border-radius:6px}
.foot{position:absolute;left:44px;bottom:22px;font-size:19px;color:#A9A49B}
</style></head><body>
<div class="top"><div class="brand">司南 · 点位<span>一片区域，一张表</span></div><div class="note">示意图 · 数据为虚构</div></div>

<div class="stage">
  <div class="grid"></div>
  <div class="road r1"></div><div class="road r2"></div><div class="road r3"></div><div class="road r4"></div>
  <div class="ring"></div>
  <div class="hub"></div><div class="hublabel">中心位置</div>

  <div class="pt" style="left:300px;top:196px;background:#8FBF9F"></div><div class="lb" style="left:336px;top:200px">P-01</div>
  <div class="pt" style="left:604px;top:246px;background:#2E6BE6"></div><div class="lb" style="left:638px;top:252px">P-02</div>
  <div class="pt" style="left:806px;top:430px;background:#D8C9A6"></div><div class="lb" style="left:720px;top:434px">P-03</div>
  <div class="pt" style="left:404px;top:494px;background:#8FBF9F"></div><div class="lb" style="left:440px;top:500px">P-04</div>
  <div class="pt" style="left:230px;top:418px;background:#D8C9A6"></div><div class="lb" style="left:168px;top:464px">P-05</div>
  <div class="pt" style="left:864px;top:220px;background:#C0574C"></div><div class="lb" style="left:900px;top:226px">P-06</div>
  <div class="pt sq" style="left:330px;top:642px;background:#CFCAC2"></div><div class="lb" style="left:366px;top:644px">P-07</div>
  <div class="pt sq" style="left:742px;top:626px;background:#8FBF9F"></div><div class="lb" style="left:656px;top:630px">P-08</div>
  <div class="pt sq" style="left:150px;top:180px;background:#CFCAC2"></div><div class="lb" style="left:106px;top:216px">P-09</div>
  <div class="pt tri" style="left:520px;top:660px;border-bottom-color:#D8C9A6"></div><div class="lb" style="left:556px;top:666px">P-10</div>
</div>

<div class="panel">
  <div class="card">
    <div class="ct">点位明细</div>
    <div class="pname"><span class="dot"></span>P-02</div>
    <div class="rows"><span>状态</span><b>已接触 · 3 次</b></div>
    <div class="rows"><span>最近一次</span><b>6 月 12 日</b></div>
    <div class="rows"><span>留资</span><b>2 条</b></div>
    <div class="rows"><span>下一步</span><b>周六再约</b></div>
  </div>

  <div class="card">
    <div class="ct">读法</div>
    <div class="legend">
      <div class="li"><span class="sw" style="background:#CFCAC2"></span>没去过</div>
      <div class="li"><span class="sw" style="background:#D8C9A6"></span>接触过</div>
      <div class="li"><span class="sw" style="background:#2E6BE6"></span>已留资</div>
      <div class="li"><span class="sw" style="background:#8FBF9F"></span>有意向</div>
      <div class="li"><span class="sw" style="background:#C0574C"></span>明确不做</div>
      <div class="li"><span style="width:16px;height:16px;display:inline-block;border-radius:4px;background:#B9B3A8"></span>方形＝门店</div>
      <div class="li"><span style="width:16px;height:16px;display:inline-block;border-radius:50%;background:#B9B3A8"></span>圆形＝社区</div>
      <div class="li"><span style="width:0;height:0;border-left:9px solid transparent;border-right:9px solid transparent;border-bottom:16px solid #B9B3A8;display:inline-block"></span>三角＝商圈</div>
    </div>
  </div>

  <div class="card" style="margin-bottom:0">
    <div class="ct">组员进度</div>
    <div class="rows" style="margin-top:0"><span>组员 A</span><b>13 / 20</b></div>
    <div class="bar"><i></i></div>
  </div>
</div>

<div class="foot">颜色＝走到哪一步，形状＝点位类型。距离按坐标直线量，不是导航里程。</div>
</body></html>
